[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-platform"
version = "0.1.0"
description = "A production-oriented enterprise knowledge platform with hybrid retrieval and grounded generation."
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
