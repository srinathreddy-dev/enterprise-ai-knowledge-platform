[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-platform"
version = "0.1.0"
description = "A production-oriented enterprise knowledge platform with hybrid retrieval and grounded generation."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.5.3",
    "pymupdf==1.28.2",
    "rank-bm25==0.2.2",
]
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
